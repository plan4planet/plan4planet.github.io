# -----------------------------------------------------------------------------
# Page Info
# -----------------------------------------------------------------------------
title: 2026 Fall Symposium on Planning for a Better Planet
description: " 📅 Nov 5-7, 2026 | 📍 Arlington, VA  \n \n The website for the 2026 Planning for a Better Planet AAAI Fall Symposium, which aims to bring together AI planning researchers with climate domain experts to tackle the challenge of making the planet a healthier, more sustainable place."
url: "https://www.plan4planet.org"
logo: /assets/images/plan4planet.png

# Enforce a large image display format for Twitter/X cards
twitter:
  card: summary_large_image

social:
  name: 2026 Fall Symposium on Planning for a Better Planet
  url: "https://www.plan4planet.org"

# Sets a default fallback image for all pages on the site
defaults:
  - scope:
      path: "" # Applies to all files in the project
    values:
      image: /assets/images/plan4planet_share.png

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# -----------------------------------------------------------------------------
# Theme Activation
# -----------------------------------------------------------------------------
theme: minima

# -----------------------------------------------------------------------------
# Minima Theme Customization
# -----------------------------------------------------------------------------
minima:
  # Automatically switch between light/dark mode based on system settings
  skin: solarized

  # Standard date formatting (e.g., "Jul 7, 2026")
  date_format: "%b %-d, %Y"

google_analytics: G-VSGECY5X2H

