title: 2026 Fall Symposium on Planning for a Better Planet
description: 📅 November 5-7, 2026 | 📍 Arlington, VA | ⏳ Submission deadline: September 1.  The 2026 Planning for a Better Planet AAAI Fall Symposium brings together formal planning and reasoning researchers with climate domain experts to tackle the challenge of making the planet a healthier, more sustainable place. This symposium aims to gather both the AI and climate communities to discuss opportunities for climate-motivated planning research. This includes not only AI researchers sharing new algorithms and applications but also climate experts sharing successes and challenges from their own domains, with the goal of highlighting “problems in search of solutions” to drive future climate-oriented planning research.
url: "https://plan4planet.github.io/"
logo: /assets/AAAI-Logo.png

# Enforce a large image display format for Twitter/X cards
twitter:
  card: summary_large_image

social:
  name: 2026 Fall Symposium on Planning for a Better Planet
  url: "https://plan4planet.github.io/"

# Sets a default fallback image for all pages on the site
defaults:
  - scope:
      path: "" # Applies to all files in the project
    values:
      image: /assets/plan4planet_share.png

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# -----------------------------------------------------------------------------
# Theme Activation
# -----------------------------------------------------------------------------
theme: minima

# -----------------------------------------------------------------------------
# Minima Theme Customization
# -----------------------------------------------------------------------------
minima:
  # Automatically switch between light/dark mode based on system settings
  skin: solarized

  # Standard date formatting (e.g., "Jul 7, 2026")
  date_format: "%b %-d, %Y"


