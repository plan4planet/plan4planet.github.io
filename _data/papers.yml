# Accepted papers, grouped by theme. Rendered by pages/papers.md.
# number is the EasyChair submission number; abstracts come from the EasyChair export.
- id: disaster-and-hazard-adaptation
  heading: "⛈️ Disaster and Hazard Adaptation"
  papers:
    - number: "3936"
      title: "Compound-Hazard Feasibility Gaps in Climate Adaptation Planning"
      authors: "Srimonti Dutta and Akshata Kishore Moharir (WAI USA)"
      abstract: |
        Single-hazard feasibility checks do not establish that climate adaptation responses remain jointly executable when hazards compound. Required capabilities may be lost, shared resources may tighten, and otherwise feasible responses may compete when activated together. We formalize this composition failure using temporal and resource-planning concepts and introduce the Compound-Hazard Feasibility Gap (CHFG), the weighted share of eligible compound scenarios in which separately validated constituent responses lose default feasibility when combined.

        We apply the diagnostic to a document-grounded case constructed from six actions in the 2024 New York City Hazard Mitigation Plan. Under explicitly illustrative capacities, demands, and stress reductions, all goal-activating single-stressor baselines are feasible, while 10 of 19 evaluated two- and three-stressor scenarios lose default feasibility, yielding CHFG=0.53. With default and permitted alternative responses available, 15 of the 19 scenarios retain at least one feasible response. Capability and resource-failure traces identify why feasibility is lost. The framework supports compound-hazard plan audits, contingency design, resource-constrained scheduling, and planning benchmarks without treating the illustrative case as an operational model of New York City.
    - number: "4972"
      title: "Data Fragmentation as a Critical Bottleneck in Disaster Response Planning: The EVAC-AI Case Study for Flood Risk Assessment"
      authors: "Gayatri Ramchandra Vaidya, Yasas Senarath, and Hemant Purohit (George Mason University)"
      abstract: |
        Coastal flood risk in regions such as Hampton Roads, Virginia, is constrained not by a lack of data, but by the fragmentation of that data across agencies, formats, and update cadences. Addressing this fragmentation requires three capabilities: integrating heterogeneous sources into a consistent representation, optimizing decisions by reasoning across transportation, planning and urban planning. The coordinating role-specific access to a shared information base. We present EVAC-AI, a knowledge-graph-grounded conversational Q&A system designed to support all three capabilities for coastal flood evacuation planning in Virginia Beach.

        EVAC-AI integrates independently maintained data sources, including into a single Neo4j knowledge graph. This graph is exposed through a natural-language query pipeline that translates user questions directly into validated, schema-refined Cypher queries, rather than retrieving subgraphs for an LLM to summarize. We argue that this design directly supports the three requirements: direct query execution preserves the structure and relationships of the graph through to the final answer, grounds multi-hop decisions in explicit and auditable graph traversals rather than generated summaries, and ensures that users in different roles receive responses backed by the same verifiable graph results. A single-page chatbot-and-map interface demonstrates the architecture in practice by returning both natural-language answers and corresponding map highlights for queries spanning flood zones, evacuation routes, and shelters.
    - number: "1399"
      title: "What Aggregate Accuracy Hides: A Failure-Mode Analysis of Language-Guided Disaster Segmentation for Mitigation Planning"
      authors: "Prince Gnan Praveen Alikana, Samruddhi Pradeep Deshmukh, and Hemant Purohit (George Mason University)"
      abstract: |
        Effective disaster mitigation and planning require accurate, spatially explicit maps of risk exposure that identify the intersection of hazards, populations, built assets, and viable transportation routes prior to an event. Language-guided segmentation models can generate such maps directly from imagery by responding to natural-language queries rather than relying on fixed label sets. However, these models have been developed and validated on general geospatial scenes, and existing evaluations typically report only aggregate accuracy, which conceals specific failure modes and limits the planner's ability to assess model trustworthiness. This paper presents a structured cross-dataset failure-mode analysis of two leading models, LISAT and UniGeoSeg, evaluated on DisasterM3 (satellite) and DisasterVQA (ground-level) datasets. Post-event recognition is necessary but not enough for the harder pre-event task. Both models fail where pre-event planning matters most. Importantly, the model that leads on general geospatial benchmarks performs poorly on disaster imagery, underperforming architectures it otherwise surpasses. A big share of errors involves confident mask predictions in scenes without targets, especially on roads, which could cause evacuation-routing layers to avoid clear routes. Neither model consistently recognizes intact but exposed assets, a key capability for effective risk mapping. These shortcomings are structural: neither model was trained on disaster damage, neither incorporates damage-state modifiers from queries, and no dataset pairs low-altitude aerial imagery with both damage masks and language annotations. This research delivers a reusable, planning-oriented failure taxonomy and outlines the dataset gap that must be addressed before language-guided risk mapping can reliably support disaster mitigation.
- id: communities-health-and-stakeholders
  heading: "🤝 Communities, Health, and Stakeholders"
  papers:
    - number: "6776"
      title: "Explainable and Robust Representation-Aware Planning for Climate-Health Adaptation in India"
      authors: "Yajnaseni Dash (KIET Deemed to be University) and Sudhir Chandra Sarangi (All India Institute of Medical Sciences, New Delhi)"
      abstract: |
        Climate adaptation budgets are limited, while hazard exposure, public-health burden, service capacity, and socioeconomic disadvantage vary across jurisdictions. We formulate state-level climate-health adaptation prioritization as a transparent, scenario-robust planning problem rather than a prediction task. Our India case study integrates 2021 state-level climate-vulnerability indicators with a 2024 district-level flood and drought risk assessment. The resulting table contains 29 report-defined units and five auditable planning dimensions. A mixed-integer program selects a fixed-size portfolio subject to geographic-representation and compound-hazard constraints; model-native explanations decompose scores, attribute constraint effects, test scenario stability, and generate feasible contrasts. At a budget of 10 interventions, the robust portfolio covers all six analytical zones and achieves 45.7% worst-case need coverage, versus 44.7% for constrained equal need, 40.8% for constrained published vulnerability, and 36.0% for constrained population density. Nine selections are shared by all four single-scenario constrained portfolios. This is a reproducible decision-support demonstration, not a causal health-impact evaluation.
    - number: "1804"
      title: "Recentering Care in Climate Data Work as Integral for Climate AI"
      authors: "Amelia Dogan (University of Washington), Mingxin Zhang (Global Energy Monitor), Cayla Key, and Lindah Kotut (University of Washington)"
      abstract: |
        As countries transition away from fossil fuels, energy infrastructure generates much data. However, we must also care for our planet, environment, and each other in new ways for this transition to be successful. This study draws on observations and speculative design with a climate data worker monitoring this transition to understand what care does and might look like in this field. We found that care was not deeply embedded in the data work itself but instead surfaced in surrounding practices and relationships with the climate, coworkers, and others. We argue that attending to the political dimensions of care in the context of climate data may better serve a world figuring out how to plan ameliorating fossil fuel extraction. We offer provocations for those working on AI systems related to climate to include climate data workers and to attend to matters of care beyond just data work.
    - number: "3929"
      title: "From Delegates to Trustees: Aligning LLM Planners with Absent Stakeholders in Climate Decision-Making"
      authors: "Zhangfei Yang (The George Washington University)"
      abstract: |
        Climate decisions, such as where to invest scarce adaptation funds, how to sequence coastal defences under sea-level rise, and how to share a carbon budget, affect constituencies that may be unable to participate in making them or systematically excluded from doing so: future generations, distant and marginalized communities, and non-human systems. Large language models (LLMs) are increasingly proposed as planning assistants for such decisions, yet the dominant way of aligning them, reinforcement learning from human feedback (RLHF) and its preference-based successors, aligns a model to the expressed preferences of annotators who are present, available, and demographically narrow. Borrowing a distinction from the theory of political representation, we argue that preference-based alignment implements a delegate model of representation, whereas climate planning requires a trustee model: acting in the interest of principals who cannot give feedback. We propose Trustee Alignment, a paradigm in which the alignment target is a mandate rather than a scalar reward, where a mandate is a set of constituencies, each endowed with a charter, a grounded interest model, and non-negotiable safeguards; alignment is assessed at the level of plans and their modeled consequences rather than utterances; normative uncertainty (for instance, over discount rates) is handled by an explicit parliamentary procedure rather than learned from annotators; and every plan carries a contestable ledger for human oversight. We instantiate the paradigm as an LLM-Modulo planning loop with constituency-indexed trustee critics, illustrate it on coastal adaptation pathways, and set out open problems for the planning community.
- id: climate-policy-governance-and-economics
  heading: "⚖️ Climate Policy, Governance, and Economics"
  papers:
    - number: "5356"
      title: "Can This Climate Plan Actually Be Implemented? Testing Climate Plan Executability under Institutional Constraints"
      authors: "Srimonti Dutta and Akshata Kishore Moharir (WAI USA)"
      abstract: |
        The feasibility of a selected climate adaptation portfolio depends on whether the responsible institution can schedule its actions within available staffing, funding windows, procurement capacity, dependencies, authority, and deadlines. We formalize this post-selection problem as climate plan executability: the existence of an implementation schedule that jointly satisfies the time-indexed institutional constraints of a selected adaptation portfolio. Research on adaptation implementation and plan quality documents responsible parties, timelines, budgets, and other conditions associated with delivery. We extend this information to the portfolio level by testing its joint feasibility for a given institution and planning horizon, and define a Plan-to-Schedule Gap when no such schedule exists. We introduce the Climate Planning Execution Profile (CPEP), a structured interface for translating implementation evidence into a planning instance while retaining provenance and uncertainty. A synthetic heat-adaptation portfolio demonstrates how aggregate affordability and individual action feasibility can coexist with portfolio-level infeasibility under a shared-capacity conflict, while an institutionally constrained repair formulation identifies admissible changes that restore feasibility. The formulation links climate-adaptation implementation research with automated planning, temporal and resource-constrained scheduling, and constraint explanation, and provides a basis for empirical analysis of Plan-to-Schedule Gaps and institutional bottlenecks using climate adaptation plans and administrative records.
    - number: "9311"
      title: "Stress-Testing CBAM under Export Reallocation with RICE-M: A Multi-Agent Reinforcement Learning Climate-Economic Model with MRIO-Calibrated Trade"
      authors: "Phillip Wozny (Tilburg University), Andrew Williams (Université de Montréal; Mila – Quebec Artificial Intelligence Institute), Koen Ponse (Leiden University), Kai-Hendrik Cohrs (Universitat de València), and Erman Acar (University of Amsterdam)"
      abstract: |
        The EU Carbon Border Adjustment Mechanism (CBAM) prices the embedded carbon of selected imports. Its effects depend partly on how self-interested trade partners adjust production, mitigation, and export allocation in response. Multi-agent reinforcement learning (MARL) integrated assessment models such as RICE-N provide a way to evaluate such responses before deployment: regional agents are trained inside the policy environment, and their learned strategies identify potential weaknesses in the mechanism. The credibility of such a stress test depends on whether the simulator represents the strategic response margins available to exporters. A central concern of CBAM is the diversion of emissions-intensive exports to unregulated markets. In an aggregate model with a single composite good such as RICE-N, this cannot be represented. We present RICE-M, a disaggregated extension of RICE-N with bilateral, sectoral trade calibrated to multi-regional input-output (MRIO) data, regional damages, and transition costs. In policy-conditioning experiments, the learned policy reroutes emissions-intensive exports away from the EU when CBAM is active. Furthermore, mitigation response is reduced by fixing export reallocation. These results suggest a crowd-out effect where trade reallocation weakens the mitigation response to CBAM. We are currently exploring how this effect can be overcome by climate-finance mechanisms.
    - number: "4735"
      title: "Reinforcement Learning from Ecological Feedback (RLEF): A Framework for Aligning Language-Model Planning with Planetary Boundaries"
      authors: "Zhangfei Yang and Aizierjiang Aiersilan (The George Washington University)"
      abstract: |
        Large language models are increasingly considered for planning tasks in energy, infrastructure, and climate policy, yet their alignment mechanisms rarely evaluate the long-horizon physical consequences of the plans they generate. Preference-based methods can incorporate environmental values, but they leave evaluators to infer consequences that may depend on decades of interacting ecological and economic dynamics. We propose Reinforcement Learning from Ecological Feedback (RLEF), a framework in which language-model proposals are grounded into simulator-executable interventions, their consequences are projected from the observed planetary state by climate-economy or Earth-system models, and the resulting trajectories are scored against explicit ecological constraints together with a separate task-specific utility term for economic and distributional objectives. The constraints are organized by the Planetary Boundaries framework, whose 2023 assessment finds six of nine boundaries already transgressed, so that feedback must register movement back toward the safe operating space and not only the avoidance of new transgressions. We formalize RLEF as a penalty-based objective, identify it as a fixed-multiplier Lagrangian relaxation of a constrained reinforcement-learning problem, and thereby locate its contribution in the feedback architecture rather than in a new policy-optimization algorithm. International carbon-market design serves as an illustrative example of how the framework could be instantiated. RLEF is presented as a conceptual and formal framework whose main obstacles are grounding fidelity, simulator misspecification and uncertainty, computational cost, normative specification, and the absence of empirical validation.
- id: environmental-monitoring-and-sensing
  heading: "🕵️ Environmental Monitoring and Sensing"
  papers:
    - number: "0971"
      title: "Toward Adaptive Planning for Autonomous Glider Observations of Subsurface Marine Heatwaves"
      authors: "Charlotte Z. Reed, Victor-Alexandru Darvariu (University of Oxford, Oxford Robotics Institute), Helen L. Johnson (University of Oxford, Department of Earth Sciences), and Nick Hawes (University of Oxford, Oxford Robotics Institute)"
      abstract: |
        Marine heatwaves (MHWs) are increasing in frequency, duration, and intensity. The subsurface structure of MHWs remains poorly understood despite its importance for the ocean and climate sciences. Underwater glider robots, which traverse the entire water column, enable observations of subsurface temperatures. However, while autonomous navigation planning methods for gliders have recently been validated operationally, they rely on navigation to static pre-specified targets. This is unsuitable for monitoring MHWs, which are dynamic phenomena that evolve in time and space. In this work, we propose a planning approach for enabling gliders to observe MHWs. We discuss both operational and scientific requirements for such an approach, which are informed by our recent navigation planning system and analysis of MHWs in the North Sea. We propose a three-layer architecture that incorporates temperature anomaly prediction, scientific task scoring, and task planning based on scores and feasibility estimates. Lastly, we discuss our plans for evaluating the proposed system and the key research questions.
    - number: "8177"
      title: "Physics-Guided Multi-Robot Planning for Climate Sensing"
      authors: "Benjamin Shaffer (University of Pennsylvania), Victoria Edwards (University of New Hampshire), and M. Ani Hsieh (University of Pennsylvania)"
      abstract: |
        Better scientific understanding of climate processes enables forecasting and planning for natural events. Data is essential to validate scientific hypotheses, however existing data collection methods (satellites, sensor networks, and humans) are unable to resolve critical events of interest, e.g., heat transfer below ice shelves or storm driven carbon exchange. Our goal is to leverage coordinate multi-robot teams with learned surrogate models to produce a closed-loop physics discovery pipeline that 1) collects better climate relevant data, 2) improves online climate modeling, 3) and explores previously hard to measure environmental features.
    - number: "8819"
      title: "Planning Wildlife Monitoring Under Ecological Uncertainty: Scenario-Based Sensor Placement for Resource-Constrained Conservation Programs"
      authors: "Hannah Murray (University of Southern California), Amrita Gupta (Microsoft AI for Good Lab), Arielle W. Parsons, Justin P. Suraci (Conservation Science Partners), and Bistra Dilkina (University of Southern California)"
      abstract: |
        Climate change is affecting our wildlife in multiple ways, including where they live, how they move, and the health of their populations. The key metric underlying these measures is species population size. Given how important this metric is, ecologists deploy sensors such as camera traps across landscapes to capture observations of their target species. Spatial Capture-Recapture (SCR) models are a primary method for estimating species population size from these sensor observations. However, the quality of the population size estimates from SCR depend heavily on how the sensors are allocated across the landscape. This is a resource allocation problem. Most ecologists place sensors naively in a uniform grid, ignoring knowledge of species' habitat preferences. If they do account for the preferences, they assume they have perfect knowledge of the habitat impacts on species behavior, which is highly unlikely. We present a simulation-based planning framework that explicitly optimizes over this uncertainty, evaluating candidate sensor configurations across many plausible ecological scenarios. We implement this framework using a greedy search algorithm (SAA-Greedy) and a genetic algorithm (SAA-Genetic). We demonstrate the framework with two case studies: an American marten survey in British Columbia, Canada, where practitioners must plan sensor placement from scratch, and a real-world grizzly bear monitoring program in the same region, where practitioners must reduce an existing sensor network under a tightened resource budget. In the marten case study, SAA-Greedy consistently achieved lower RSE and mean absolute bias than a uniform grid baseline and a single-scenario genetic algorithm. In the grizzly bear case study, we found that 11 sensors could be removed from an existing 61-camera deployment with minimal performance loss. We discuss how this framework extends to adaptive, multi-period sensor reallocation planning, offering a decision-support tool for conservation and climate-adaptation practitioners operating under limited monitoring budgets and ecological uncertainty.
- id: energy-systems-and-decarbonization
  heading: "⚡ Energy Systems and Decarbonization"
  papers:
    - number: "7165"
      title: "AI Planning as Solution and as Consumer: Computational Energy as a Planning Resource"
      authors: "Ilche Georgievski (University of Stuttgart)"
      abstract: |
        The energy consumption of software has become an environmental concern, and Green AI promotes reporting energy use alongside performance metrics. AI planning has entered this discussion through work that measures planners in benchmark settings. This paper examines the energy consumption of AI planning as it is deployed, using building automation as an example. We distinguish two roles of planning in climate domains: an outward role, in which plans act on a physical system, and an inward role, in which deliberation consumes energy. When the outward effect is energy drawn from the same supply as deliberation, the net effect of planning becomes assessable. We analyse this consumption, whose structure offers no reuse: domain models are validated by repeated planner execution and plans are re-derived at every invocation. We locate the consumption across a development life cycle, propose computational energy as a first-class planning resource, and state the resulting research challenges.
    - number: "2054"
      title: "Refined Thompson Learning for Adaptive Bandits: Power-Efficient Flexibility Scheduling Across Data Centers"
      authors: "Zixi Chen, Yifu Ding, Ruicheng Ao, David Simchi-Levi, and Thomas Magnanti (Massachusetts Institute of Technology)"
      abstract: |
        The rapid growth of large-scale AI workloads in data centers has placed increasing pressure on power grids in recent years. Since power systems must continuously balance supply and demand, there is growing interests in leveraging data-center workload flexibility as a grid service. We propose a contextual restless multi-armed bandit (CRMAB) framework in which a grid operator requests load reductions without observing internal job-scheduling decisions. Under index-ability guarantee, each data center or physical machine is modeled as a Markov decision process (MDP) over a cyclic virtual-machine (VM) job queue, with unknown rewards and transition dynamics learned online using Thompson sampling and Whittle-index policies. To improve learning under sparse and noisy observations, the framework augments an adaptive Thompson–Whittle (TW) policy with domain-informed transition priors and gated prior mixing. In baseline experiments, the best adaptive refined variant achieves 91.4% of the oracle reward after 100 rounds and 96.8% after 1,000 rounds. Across a 16-setting stress test spanning different state-space sizes and levels of contextual noise, the best refined variant consistently outperforms the original TW policy with high confidence while remaining competitive with EXP4. A graph-based prior further incorporates data-center hardware constraints, including computing-resource limits. Overall, the results demonstrate the economic potential of data-center flexibility as a grid service and highlight the importance of high-quality, open source AI workload traces for developing and evaluating such services.
