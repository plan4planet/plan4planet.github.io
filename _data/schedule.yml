# Draft program, rendered on /schedule/ (pages/schedule.md).
# Source: the "Draft program" tab of the speaker-info Google Doc.
#
# Each day has a `room` (where its sessions are, shown under the day heading) and a list of slots. A slot with only `time` and `title` renders as a break row.
# Session items: `label` (required), then optional `speaker` (links to /speakers/), `talk` (confirmed
# talk titles only), and `papers` (accepted-paper talks, as on /papers/). Optional `prompts` on a
# session: example discussion questions, shown in a collapsed list.

- day: Day 1
  date: Thursday, November 5
  room: Fitzgerald Ballroom D, second floor
  id: day-1
  slots:
    - time: 9:00–10:30
      title: Welcome
      items:
        - label: Welcome remarks
        - label: Small-group introductions
        - label: Planning overview
          speaker: Stephen Wissow
          talk: "Deciding What to Do? Try Planning!"
        - label: "Community-engaged research: overview and group exercise"
          speaker: Sacoby Wilson
    - time: 10:30–11:00
      title: Coffee break and poster session
    - time: 11:00–12:30
      title: Planning and Delivering Adaptation
      items:
        - label: Invited talk
          speaker: Luis E. Ortiz
          talk: "Modeling Urban Climates: Challenges and Opportunities with AI"
        - label: Accepted papers
          papers:
            - authors: Dutta and Moharir
              title: Compound-Hazard Feasibility Gaps in Climate Adaptation Planning
            - authors: Dutta and Moharir
              title: "Can This Climate Plan Actually Be Implemented? Testing Climate Plan Executability under Institutional Constraints"
        - label: Moderated questions
        - label: Small-group discussion
      prompts:
        - "What adaptation-related needs might policymakers and communities have (e.g., resilient infrastructure siting, resource allocation, disaster recovery)?"
        - "How can we translate research into accessible tools for communities and policymakers?"
        - "What are other ways that planning research can help adaptation?"
    - time: 12:30–2:00
      title: Lunch (off site)
      subtitle: "Join us at Quarter Market, the food hall in Ballston Quarter (5-minute walk): grab food from any counter and find us at the tables."
    - time: 2:00–3:30
      title: Energy and Computation
      items:
        - label: Invited talk
          speaker: Carla P. Gomes
          talk: "Computational Sustainability: Computing for a Better World and a Sustainable Future"
        - label: Warm-up partner discussion
        - label: Accepted papers
          papers:
            - authors: Georgievski
              title: "AI Planning as Solution and as Consumer: Computational Energy as a Planning Resource"
            - authors: Chen et al.
              title: "Refined Thompson Learning for Adaptive Bandits: Power-Efficient Flexibility Scheduling Across Data Centers"
        - label: Moderated questions
        - label: Small-group discussion
      prompts:
        - "What are your biggest questions about climate mitigation?"
        - "Are there opportunities for planning research to transfer to relatively understudied areas, such as multi-agent coordination for industrial process control or task planning for residential electrification?"
    - time: 3:30–4:00
      title: Coffee break and poster session
    - time: 4:00–5:00
      title: "Partnering Across Fields: Success Factors and Risks"
      items:
        - label: Individual reflection, on sticky notes
        - label: Small-group discussion
        - label: Table share-outs of themes, which feed into Friday's facilitated session
      prompts:
        - "Our collaboration will be successful when…"
        - "The greatest risk to the success of our collaboration could be…"
    - time: 5:30–6:30
      title: AAAI reception
      subtitle: Second-floor pre-function area, outside Fitzgerald Ballroom C

- day: Day 2
  date: Friday, November 6
  room: Fitzgerald Ballroom D, second floor
  id: day-2
  slots:
    - time: 9:00–10:30
      title: Measuring a Changing Planet
      items:
        - label: Invited talk
          speaker: Joanmarie Del Vecchio
          talk: "Algorithms for the Anthropocene: The Promise and Pitfalls of Machine Learning in a Changing Arctic"
        - label: Small-group discussion
        - label: Accepted papers
          papers:
            - authors: Reed et al.
              title: Toward Adaptive Planning for Autonomous Glider Observations of Subsurface Marine Heatwaves
            - authors: Shaffer et al.
              title: Physics-Guided Multi-Robot Planning for Climate Sensing
            - authors: Murray et al.
              title: "Planning Wildlife Monitoring Under Ecological Uncertainty: Scenario-Based Sensor Placement for Resource-Constrained Conservation Programs"
        - label: Moderated questions
      prompts:
        - "How can planning research help improve the scope, scale, and cost of climate data to support climate modeling and environmental monitoring?"
        - "How can planning research leverage recent advances in ML-based climate models, and what new planning challenges does their widespread use expose?"
    - time: 10:30–11:00
      title: Break
    - time: 11:00–12:30
      title: Goals and Governance
      subtitle: "Whose Objective? The Hidden Choices in Planning for Climate"
      items:
        - label: Invited talk
          speaker: Stéphane Hallegatte
          talk: "How Many People Are at High Risk from Climate Hazards? The Data and Methodological Challenge"
        - label: Accepted papers
          papers:
            - authors: Yang
              title: "From Delegates to Trustees: Aligning LLM Planners with Absent Stakeholders in Climate Decision-Making"
            - authors: Wozny et al.
              title: "Stress-Testing CBAM under Export Reallocation with RICE-M: A Multi-Agent Reinforcement Learning Climate-Economic Model with MRIO-Calibrated Trade"
            - authors: Yang and Aiersilan
              title: "Reinforcement Learning from Ecological Feedback (RLEF): A Framework for Aligning Language-Model Planning with Planetary Boundaries"
        - label: Panel with moderated questions
      prompts:
        - "Whose losses does the objective count, and with what weights? How much does the future count, and who sets the discount factor?"
        - "How should a planner decide when the probabilities themselves are contested?"
        - "What role can planning research (multi-agent coordination, mechanism design) play in the economic and policy dimensions of mitigation, such as carbon markets, emissions trading design, corporate carbon accounting, and the equitable phase-out of fossil fuel infrastructure?"
    - time: 12:30–2:00
      title: Lunch (off site)
      subtitle: "Tentatively a joint lunch with the Parsimonious SciML symposium: small groups from both symposia head out to lunch together. Details to be announced."
    - time: 2:00–3:30
      title: Planning Tools for Climate Users
      items:
        - label: Invited talk
          speaker: Biplav Srivastava
          talk: Some Lessons from Smart Transportation and Beyond to Help Plan for a Better Planet
        - label: Small-group discussion
        - label: Accepted papers
          papers:
            - authors: Dogan et al.
              title: Recentering Care in Climate Data Work as Integral for Climate AI
            - authors: Vaidya et al.
              title: "Data Fragmentation as a Critical Bottleneck in Disaster Response Planning: The EVAC-AI Case Study for Flood Risk Assessment"
            - authors: Alikana et al.
              title: "What Aggregate Accuracy Hides: A Failure-Mode Analysis of Language-Guided Disaster Segmentation for Mitigation Planning"
        - label: Moderated questions
      prompts:
        - "How do some of these lessons apply to your own area of planning and climate work?"
    - time: 3:30–4:00
      title: Break
    - time: 4:00–5:15
      title: "Meeting the Moment: Connection and the Call for Leadership"
      items:
        - label: "Connect as people: a short warm-up"
        - label: "Connect as collaborators: a talent and ideas marketplace, then a gallery walk to find shared interests"
        - label: "Connect as co-leaders: barriers to collaboration across AI planning and climate research, and how to address them"
        - label: Synthesis, and a look ahead to Saturday's community discussion
    - time: 5:30–6:30
      title: AAAI plenary
      subtitle: Fitzgerald Ballroom C

- day: Day 3
  date: Saturday, November 7
  room: Fitzgerald Ballroom D, second floor
  id: day-3
  slots:
    - time: 9:00–10:30
      title: Community Discussion
      items:
        - label: "Framing: a community of practice for climate-oriented planning research"
        - label: Facilitated discussions, with share-outs
      prompts:
        - "What do we want in a community of climate-inspired planning researchers?"
        - "How do we create a community that supports both applied and foundational research under an umbrella of climate motivation?"
        - "What engagement between researchers, industry, funding agencies, and policymakers is needed to support climate-oriented planning research?"
    - time: 10:30–11:00
      title: Break
    - time: 11:00–12:30
      title: Closing and Next Steps
      items:
        - label: Options for growing the community
        - label: Feedback for the organizers
        - label: Next steps and volunteers
