            - authors: Murray et al.
              title: "Planning Wildlife Monitoring Under Ecological Uncertainty: Scenario-Based Sensor Placement for Resource-Constrained Conservation Programs"
              slides: murray-planning-wildlife-monitoring.pdf
        - label: Moderated questions
      prompts:
        - "How can planning research help improve the scope, scale, and cost of climate data to support climate modeling and environmental monitoring?"
        - "How can planning research leverage recent advances in ML-based climate models, and what new planning challenges does their widespread use expose?"
    - time: 10:30–11:00
      title: Break
    - time: 11:00–12:30
      title: "Who Counts: Vulnerability, Equity, and the Objective"
      subtitle: "Who is at risk, who bears the cost, and whose interests enter the objective. Mitigation offers diffuse global benefits while imposing concentrated costs; adaptation funds reach some people and not others. These are normative questions, and this session surfaces them with a climate economist and three papers that each take one axis head-on."
      items:
        - label: Invited talk
          speaker: Stéphane Hallegatte
          talk: "How Many People Are at High Risk from Climate Hazards? The Data and Methodological Challenge"
        - label: Accepted papers
          papers:
            - authors: Yang
              title: "From Delegates to Trustees: Aligning LLM Planners with Absent Stakeholders in Climate Decision-Making"
            - authors: Wozny et al.
              title: "Stress-Testing CBAM under Export Reallocation with RICE-M: A Multi-Agent Reinforcement Learning Climate-Economic Model with MRIO-Calibrated Trade"
            - authors: Yang and Aiersilan
              title: "Reinforcement Learning from Ecological Feedback (RLEF): A Framework for Aligning Language-Model Planning with Planetary Boundaries"
        - label: Panel with moderated questions
      prompts:
        - "Whose losses does the objective count, and with what weights? How much does the future count, and who sets the discount factor?"
        - "How should a planner decide when the probabilities themselves are contested?"
        - "What role can planning research (multi-agent coordination, mechanism design) play in the economic and policy dimensions of mitigation, such as carbon markets, emissions trading design, corporate carbon accounting, and the equitable phase-out of fossil fuel infrastructure?"
