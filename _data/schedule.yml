# The program as it ran, rendered on /schedule/ (pages/schedule.md).
# Originally from the "Draft program" tab of the speaker-info Google Doc.
#
# Each day has a `room` (where its sessions are, shown under the day heading) and a list of slots. A slot with only `time` and `title` renders as a break row.
# Session items: `label` (required), then optional `speaker` (links to /speakers/), `talk` (confirmed
# talk titles only), and `papers` (accepted-paper talks, as on /papers/). Optional `prompts` on a
# session: example discussion questions, shown in a collapsed list. Optional `outcomes` on a session:
# what came out of it, a list of groups, each with a `summary` line and `items` of `name` plus optional
# `detail`, each group shown in its own collapsed list.

- day: Day 1
  date: Thursday, November 5
  room: Fitzgerald Ballroom D, second floor
  id: day-1
  slots:
    - time: 9:00–10:30
      title: Welcome
      items:
        - label: Welcome remarks
          slides: plan4planet-welcome.pdf
        - label: "Small-group introductions: what you bring, and what you hope to find"
        - label: Planning overview
          slides: wissow-deciding-what-to-do-try-planning.pdf
          speaker: Stephen Wissow
          talk: "Deciding What to Do? Try Planning!"
        - label: Framing talk
          slides: SLIDES_Try_Planning_But_Whose_Plan_Lepissier.pdf
          speaker: Alice Lépissier
          anchor: alice-lepissier
          talk: "Try Planning! But Whose Plan? The hidden choices in planning for climate"
          abstract: >-
            Planning sits downstream of estimation and prediction: those supply the model of the world, and planning decides what to do given it. That position introduces a choice the other paradigms never confront, namely whose welfare the objective counts. This talk, for planners without a climate background, sets out why climate is a "wicked" problem that resists formulation, and why its justice problem has three dimensions: across people, across time, and across states of the world. Every planning objective aggregates along the same three axes, and the standard defaults, a scalar reward with equal weights, an expectation over uncertainty, and a discount factor chosen for convergence, are normative positions dressed as technical settings. The talk closes with two kinds of humility, about the model and about the objective, and five questions to carry through the symposium.
        - label: Round-robin introductions in new groups, with a first look at Thursday afternoon's questions
      prompts:
        - "What's one thing you bring to this room, and one thing you're hoping to find here?"
        - "Think of a collaboration across fields that worked well, or didn't. What made the difference?"
    - time: 10:30–11:00
      title: Coffee break and poster session
    - time: 11:00–12:30
      title: Planning and Delivering Adaptation
      items:
        - label: Invited talk
          slides: ortiz-modeling-urban-climates.pdf
          speaker: Luis E. Ortiz
          talk: "Modeling Urban Climates: Challenges and Opportunities with AI"
        - label: Accepted paper
          papers:
            - authors: Dutta and Moharir
              title: Compound-Hazard Feasibility Gaps in Climate Adaptation Planning
        - label: Moderated questions
        - label: Small-group discussion
      prompts:
        - "What adaptation-related needs might policymakers and communities have (e.g., resilient infrastructure siting, resource allocation, disaster recovery)?"
        - "How can we translate research into accessible tools for communities and policymakers?"
        - "What are other ways that planning research can help adaptation?"
    - time: 12:30–2:00
      title: Lunch (off site)
      subtitle: "Join us at Quarter Market, the food hall in Ballston Quarter (5-minute walk): grab food from any counter and find us at the tables."
    - time: 2:00–3:30
      title: Energy and Computation
      items:
        - label: Invited talk
          speaker: Carla P. Gomes
          talk: "Computational Sustainability: Computing for a Better World and a Sustainable Future"
        - label: Warm-up partner discussion
        - label: Accepted papers
          papers:
            - authors: Georgievski
              title: "AI Planning as Solution and as Consumer: Computational Energy as a Planning Resource"
            - authors: Chen et al.
              title: "Refined Thompson Learning for Adaptive Bandits: Power-Efficient Flexibility Scheduling Across Data Centers"
        - label: Moderated questions
        - label: Small-group discussion
      prompts:
        - "What are your biggest questions about climate mitigation?"
        - "Are there opportunities for planning research to transfer to relatively understudied areas, such as multi-agent coordination for industrial process control or task planning for residential electrification?"
    - time: 3:30–4:00
      title: Coffee break and poster session
    - time: 4:00–5:15
      title: "Community Engagement and Partnering Across Fields"
      items:
        - label: Accepted paper, moved from the morning session
          papers:
            - authors: Dutta and Moharir
              title: "Can This Climate Plan Actually Be Implemented? Testing Climate Plan Executability under Institutional Constraints"
        - label: "Community-engaged research: grassroots engagement and environmental justice"
          speaker: Sacoby Wilson
        - label: Individual reflection, on sticky notes
