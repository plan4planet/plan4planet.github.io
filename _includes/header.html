<header class="site-header" role="banner">
  <div class="wrapper">
    <!--<a class="site-title" rel="author" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>-->
    <!-- Logo and Title Link -->
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}" style="display: inline-flex; align-items: center; gap: 10px;">
      {% if site.logo %}
        <img src="{{ site.logo | relative_url }}" alt="{{ site.title | escape }} logo" style="height: 32px; width: auto;">
      {% endif %}
      <span>{{ site.title | escape }}</span>
    </a>
    
    <nav class="site-nav">
      <input type="checkbox" id="nav-trigger" class="nav-trigger" />
      <label for="nav-trigger">
        <span class="menu-icon">
          <svg viewBox="0 0 18 15" width="18px" height="15px">
            <path d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484l0,0C0,0.665,0.665,0,1.484,0 h15.032C17.335,0,18,0.665,18,1.484L18,1.484z M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516l0,0 c0-0.82,0.665-1.484,1.484-1.484h15.032C17.335,6.031,18,6.696,18,7.516L18,7.516z M18,13.516C18,14.335,17.335,15,16.516,15H1.484 C0.665,15,0,14.335,0,13.516l0,0c0-0.82,0.665-1.483,1.484-1.483h15.032C17.335,12.031,18,12.695,18,13.516L18,13.516z"/>
          </svg>
        </span>
      </label>

      <div class="trigger">
        {% for item in site.data.navigation %}
          <a class="page-link" href="{{ item.link | relative_url }}">{{ item.name }}</a>
        {% endfor %}
        <!-- Bluesky Button -->
        <a class="page-link bluesky-btn" href="https://bsky.app/profile/plan4planet.bsky.social" target="_blank" rel="noopener noreferrer">
          <svg width="16" height="16" viewBox="0 0 560 500" fill="currentColor" style="vertical-align: -2px; margin-right: 4px;">
            <path d="M123.1 32.2C172.6 69.8 240.2 138.8 280 183.1C319.8 138.8 387.4 69.8 436.9 32.2C472.5 5.2 520 -10.3 520 38.8C520 48.7 517.3 93.9 515.3 103.8C502.8 166.3 456 225 410 250C488.2 262.8 560 293.8 560 380C560 481.2 430 491.7 340 435C293.4 405.5 280 370 280 370C280 370 266.6 405.5 220 435C130 491.7 0 481.2 0 380C0 293.8 71.8 262.8 150 250C104 225 57.2 166.3 44.7 103.8C42.7 93.9 40 48.7 40 38.8C40 -10.3 87.5 5.2 123.1 32.2Z"/>
          </svg>
          Follow on Bluesky
        </a>
      </div>
    </nav>
  </div>
</header>
