{%- comment -%}
Connect buttons, from _data/channels.yml. A pending channel shows greyed out with "coming soon".
{%- endcomment -%}
<div class="action-links action-links--tight">
  {%- for c in site.data.channels %}
  {%- if c.pending %}
  <span class="btn btn-disabled" aria-disabled="true" title="Coming soon"><i class="{{ c.icon }}" aria-hidden="true"></i> {{ c.name }}<span class="deadline">coming soon</span></span>
  {%- else %}
  <a class="btn btn-brand" href="{{ c.url }}"{% unless c.url contains 'mailto:' %} target="_blank" rel="noopener noreferrer"{% endunless %}><i class="{{ c.icon }}" aria-hidden="true"></i> {{ c.name }}</a>
  {%- endif %}
  {%- endfor %}
</div>
