<footer class="site-footer">
  <div class="wrapper">

    <div class="footer-brand">
      <img class="footer-mark" src="{{ '/assets/images/plan4planet.png' | relative_url }}" alt="Plan4Planet logo">
      <div>
        <span class="wordmark">Plan<span class="four">4</span>Planet</span>
        <p class="footer-tagline">{{ site.footer_tagline | default: site.description | escape }}</p>
      </div>
    </div>

    <ul class="footer-channels" aria-label="Contact and social links">
      {%- for c in site.data.channels %}
      <li>
        {%- if c.pending %}
        <span class="is-pending" title="Coming soon"><i class="{{ c.icon }}" aria-hidden="true"></i> {{ c.short }}</span>
        {%- else %}
        <a href="{{ c.url }}"{% unless c.url contains 'mailto:' %} target="_blank" rel="noopener noreferrer"{% endunless %}><i class="{{ c.icon }}" aria-hidden="true"></i> {{ c.short }}</a>
        {%- endif %}
      </li>
      {%- endfor %}
    </ul>

    <a class="footer-series" href="https://aaai.org/conference/fall-symposia/2026-fall-symposium-series-2/" target="_blank" rel="noopener noreferrer">
      <span>Part of the</span>
      <img src="{{ '/assets/images/aaai-symposium-series.svg' | relative_url }}" alt="AAAI Symposium Series" width="121" height="40">
    </a>

  </div>
</footer>

<script>
  function expandHashTarget() {
    const target = document.getElementById(window.location.hash.slice(1));
    const details = target instanceof HTMLDetailsElement ? target : target?.querySelector(":scope > details");
    if (details) {
      details.open = true;
    }
  }

  expandHashTarget();
  window.addEventListener("hashchange", expandHashTarget);
</script>
