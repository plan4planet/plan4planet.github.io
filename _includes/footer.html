<footer class="site-footer h-card">
  <data class="u-url" value="{{ '/' | relative_url }}"></data>

  <div class="wrapper">

    <div class="footer-col-wrapper">
      <div class="footer-col">
      {%- if site.author %}
        <ul class="contact-list">
          {% if site.author.name -%}
            <li class="p-name">{{ site.author.name | escape }}</li>
          {% endif -%}
          {% if site.author.email -%}
            <li><a class="u-email" href="mailto:{{ site.author.email }}">{{ site.author.email }}</a></li>
          {%- endif %}
        </ul>
      {%- endif %}
      </div>
      <div class="footer-col">
        <p>{{ site.description | escape }}</p>
      </div>
    </div>

    <div class="footer-links" aria-label="Contact and social links">
      <a href="mailto:info@plan4planet.org">
        <i class="fa-solid fa-envelope" aria-hidden="true"></i>
        Email the team
      </a>
      <a href="https://groups.google.com/g/plan4planet-l/" target="_blank" rel="noopener noreferrer">
        <i class="fa-solid fa-users" aria-hidden="true"></i>
        Join the mailing list
      </a>
      <a href="https://bsky.app/profile/plan4planet.bsky.social" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-bluesky" aria-hidden="true"></i>
        Follow on Bluesky
      </a>
    </div>

  </div>

</footer>
