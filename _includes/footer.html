<footer class="site-footer">
  <div class="wrapper">

    <div class="footer-brand">
      <img class="footer-mark brand-mark" data-skin="a" src="{{ '/assets/brand/a/mark.svg' | relative_url }}" alt="">
      <img class="footer-mark brand-mark" data-skin="b" src="{{ '/assets/brand/b/mark.svg' | relative_url }}" alt="">
      <img class="footer-mark brand-mark" data-skin="c" src="{{ '/assets/brand/c/mark.svg' | relative_url }}" alt="">
      <div>
        <span class="wordmark">Plan<span class="four">4</span>Planet</span>
        <p class="footer-tagline">{{ site.footer_tagline | default: site.description | escape }}</p>
      </div>
    </div>

    <ul class="footer-channels" aria-label="Contact and social links">
      {%- for c in site.data.channels %}
      <li>
        {%- if c.pending %}
        <span class="is-pending" title="Coming soon"><i class="{{ c.icon }}" aria-hidden="true"></i> {{ c.short }}</span>
        {%- else %}
        <a href="{{ c.url }}"{% unless c.url contains 'mailto:' %} target="_blank" rel="noopener noreferrer"{% endunless %}><i class="{{ c.icon }}" aria-hidden="true"></i> {{ c.short }}</a>
        {%- endif %}
      </li>
      {%- endfor %}
    </ul>

  </div>
</footer>

<script>
  function expandHashTarget() {
    const target = document.getElementById(window.location.hash.slice(1));
    if (target instanceof HTMLDetailsElement) {
      target.open = true;
    }
  }

  expandHashTarget();
  window.addEventListener("hashchange", expandHashTarget);
</script>
